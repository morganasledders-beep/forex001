name: Deploy forex001 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Prepare website
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          mkdir -p dist
          cp boby_bot.html dist/index.html
          cp SETUP.md dist/SETUP.md
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.parse import urlparse

          supabase_url = os.environ.get("SUPABASE_URL", "").strip()
          supabase_anon_key = os.environ.get("SUPABASE_ANON_KEY", "").strip()
          if not supabase_url or not supabase_anon_key:
              raise SystemExit(
                  "Authentication deployment blocked: set SUPABASE_URL and "
                  "SUPABASE_ANON_KEY in GitHub Actions secrets."
              )
          parsed_url = urlparse(supabase_url)
          if parsed_url.scheme != "https" or not parsed_url.netloc:
              raise SystemExit(
                  "Authentication deployment blocked: SUPABASE_URL must be a valid HTTPS URL."
              )

          config = {
              "supabaseUrl": supabase_url,
              "supabaseAnonKey": supabase_anon_key,
          }
          Path("dist/auth-config.js").write_text(
              "window.BOBY_AUTH_CONFIG = "
              + json.dumps(config)
              + ";\n",
              encoding="utf-8",
          )
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
